name: QA Swarm
'on':
  workflow_dispatch:
    inputs:
      pr_number:
        description: The number of a pull request to post the report on
        type: string
        default: ''
jobs:
  preflight:
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Check prerequisites before starting work
        run: |
          bash .eas/agents/preflight.sh --simulator
          if [ -n "$PR_NUMBER" ]; then
            bash .eas/agents/preflight.sh --github
          fi
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
  fingerprint:
    type: fingerprint
    environment: preview
    needs:
      - preflight
  get_build_android:
    type: get-build
    needs:
      - fingerprint
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true
  get_build_ios:
    type: get-build
    needs:
      - fingerprint
    params:
      platform: ios
      profile: preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true
  build_android:
    type: build
    needs:
      - get_build_android
    if: ${{ !needs.get_build_android.outputs.build_id }}
    params:
      platform: android
      profile: preview
  build_ios:
    type: build
    needs:
      - get_build_ios
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: preview
  repack_android:
    type: repack
    needs:
      - get_build_android
    if: ${{ needs.get_build_android.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_android.outputs.build_id }}
      profile: preview
  repack_ios:
    type: repack
    needs:
      - get_build_ios
    if: ${{ needs.get_build_ios.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_ios.outputs.build_id }}
      profile: preview
  lane_android_launch:
    needs:
      - get_build_android
    after:
      - build_android
      - repack_android
    environment: preview
    env:
      BUILD_ID: ${{ after.build_android.outputs.build_id || after.repack_android.outputs.build_id }}
      PLATFORM: android
      FLOW: launch
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      session_url: ${{ steps.lane.outputs.session_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-android-launch-evidence
          path: agent-output/evidence/**/*
  lane_android_navigation:
    needs:
      - get_build_android
    after:
      - build_android
      - repack_android
    environment: preview
    env:
      BUILD_ID: ${{ after.build_android.outputs.build_id || after.repack_android.outputs.build_id }}
      PLATFORM: android
      FLOW: navigation
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      session_url: ${{ steps.lane.outputs.session_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-android-navigation-evidence
          path: agent-output/evidence/**/*
  lane_ios_launch:
    needs:
      - get_build_ios
    after:
      - build_ios
      - repack_ios
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: launch
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      session_url: ${{ steps.lane.outputs.session_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-launch-evidence
          path: agent-output/evidence/**/*
  lane_ios_navigation:
    needs:
      - get_build_ios
    after:
      - build_ios
      - repack_ios
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: navigation
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      session_url: ${{ steps.lane.outputs.session_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-navigation-evidence
          path: agent-output/evidence/**/*
  report:
    type: doc
    after:
      - lane_android_launch
      - lane_android_navigation
      - lane_ios_launch
      - lane_ios_navigation
    params:
      md: >
        # QA Swarm report


        - **Android, launch:** ${{ after.lane_android_launch.outputs.verdict || 'FAIL: The lane did not finish.' }} [Session
        recording](${{ after.lane_android_launch.outputs.session_url }})

        - **Android, navigation:** ${{ after.lane_android_navigation.outputs.verdict || 'FAIL: The lane did not finish.' }}
        [Session recording](${{ after.lane_android_navigation.outputs.session_url }})

        - **iOS, launch:** ${{ after.lane_ios_launch.outputs.verdict || 'FAIL: The lane did not finish.' }} [Session
        recording](${{ after.lane_ios_launch.outputs.session_url }})

        - **iOS, navigation:** ${{ after.lane_ios_navigation.outputs.verdict || 'FAIL: The lane did not finish.' }} [Session
        recording](${{ after.lane_ios_navigation.outputs.session_url }})


        Screenshots and lane reports are in the artifacts of [this workflow run](${{ workflow.url }}).
  pr_comment:
    after:
      - lane_android_launch
      - lane_android_navigation
      - lane_ios_launch
      - lane_ios_navigation
    if: ${{ inputs.pr_number }}
    environment: preview
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REPORT: >
        ## QA Swarm


        - **Android, launch:** ${{ after.lane_android_launch.outputs.verdict || 'FAIL: The lane did not finish.' }} [Session
        recording](${{ after.lane_android_launch.outputs.session_url }})

        - **Android, navigation:** ${{ after.lane_android_navigation.outputs.verdict || 'FAIL: The lane did not finish.' }}
        [Session recording](${{ after.lane_android_navigation.outputs.session_url }})

        - **iOS, launch:** ${{ after.lane_ios_launch.outputs.verdict || 'FAIL: The lane did not finish.' }} [Session
        recording](${{ after.lane_ios_launch.outputs.session_url }})

        - **iOS, navigation:** ${{ after.lane_ios_navigation.outputs.verdict || 'FAIL: The lane did not finish.' }} [Session
        recording](${{ after.lane_ios_navigation.outputs.session_url }})


        Screenshots and lane reports are in the artifacts of [this workflow run](${{ workflow.url }}).
    steps:
      - uses: eas/checkout
      - run: |
          printf '%s\n' "$REPORT" > /tmp/qa-report.md
          node .eas/agents/github.mjs comment "$PR_NUMBER" /tmp/qa-report.md
