name: Start the agent

permissions:
  contents: read

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

on:
  issues:
    types: [labeled]

jobs:
  start:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes eas-cli@latest workflow:run .eas/workflows/issue-to-pr.yml --ref ${{ github.sha }} -F issue_number=${{ github.event.issue.number }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
